def game = project.findProperty("SA_GAME") ?: "sa2"
def isSa1 = game == "sa1"

apply plugin: "com.android.application"

android {
    namespace "org.libsdl.app"
    compileSdkVersion 34

    defaultConfig {
        applicationId isSa1 ? "com.ylports.sonicadvance1" : "com.ylports.sonicadvance2"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 12
        versionName "0.1.0-beta1"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            // Real release build: Android does not mark the package debuggable
            // and native Java debugging is disabled. CI signs it with Gradle's
            // installable key; a private production key can replace this later.
            debuggable false
            jniDebuggable false
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
