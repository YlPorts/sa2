name: Android Release APKs

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
    paths:
      - "android/**"
      - "src/**"
      - "include/**"
      - "data/**"
      - "graphics/**"
      - "sound/**"
      - "libagbsyscall/**"
      - "tools/preproc/**"
      - "Makefile"
      - "config.mk"
      - "asm/macros/**"
      - ".github/workflows/android.yml"

jobs:
  sa2-runtime:
    name: sa2 level and controls regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native SDL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev libsdl2-dev
      - name: Run Leaf Forest Acts 1 and 2 with AddressSanitizer
        run: bash android/test-runtime.sh
      - name: Android SDL backend, full boot and menu-to-level transition
        run: SA_RUNTIME_ANDROID_BACKEND=1 bash android/test-runtime.sh

  build:
    name: ${{ matrix.game }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SA1 reserves its remaining ROM ranges and imports them on-device.
        # Neither build requires a baserom in CI.
        game: [sa1, sa2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Import and save regression checks
        run: python3 -m unittest discover -s android/tests -v

      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev curl

      - name: Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Select installed NDK
        shell: bash
        run: |
          if [[ -n "${ANDROID_NDK_LATEST_HOME:-}" && -x "$ANDROID_NDK_LATEST_HOME/ndk-build" ]]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          else
            NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -x "$NDK/ndk-build"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x android/build-apk.sh
          ./android/build-apk.sh "${{ matrix.game }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.game }}-android-release"
          path: android/out/*.apk
          if-no-files-found: error

  sa1-native-check:
    name: sa1 native compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev curl

      - name: Android SDK/NDK environment
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          if [[ -n "${ANDROID_NDK_LATEST_HOME:-}" && -x "$ANDROID_NDK_LATEST_HOME/ndk-build" ]]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          else
            NDK="$(find "$SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -x "$NDK/ndk-build"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Compile/link SA1 native
        env:
          SA1_COMPILE_CHECK: "1"
          ANDROID_ABIS: "armeabi-v7a"
        run: |
          chmod +x android/build-apk.sh
          ./android/build-apk.sh sa1
