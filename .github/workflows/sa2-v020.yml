name: Sonic Advance 2 v0.2.0 validation

on:
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: 'Publish RC1 as a prerelease after all verification jobs pass'
        required: false
        type: boolean
        default: false
  push:
    branches: [android-v0.2.0-ocs4]

permissions:
  contents: read

concurrency:
  group: sa2-v020-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev libsdl2-dev
          npm install --no-save sharp
      - name: Atlas and palette preservation
        run: |
          node tools/oc_sprites/verify.mjs
          node tools/oc_sprites/verify_revised.mjs
          node tools/oc_sprites/verify_guests.mjs
      - name: Storage, Java and water regressions
        run: python3 -m unittest discover -s android/tests -v
      - name: Multitouch, display and settings regressions
        run: bash android/test-platform.sh
      - name: Full native OC and original character integration
        run: bash android/test-ocs.sh > oc-runtime.log 2>&1
      - name: Android backend boot and actual game loop
        run: SA_RUNTIME_ANDROID_BACKEND=1 bash android/test-runtime.sh > android-runtime.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sa2-v020-test-evidence
          path: |
            *runtime.log
            build/platform-check/*.bmp
            build/oc-runtime64/captures/*.bmp
          compression-level: 9
          if-no-files-found: warn

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev curl
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Select SDK and 16 KB capable NDK
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;35.0.0' 'ndk;27.2.12479018' >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Configure existing signing key when available
        env:
          KEY_B64: ${{ secrets.SA_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SA_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SA_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SA_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEY_B64" ]]; then
            umask 077
            printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/sa2-signing.jks"
            echo "SA_SIGNING_KEYSTORE=$RUNNER_TEMP/sa2-signing.jks" >> "$GITHUB_ENV"
            echo "SA_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            # A separate installable candidate never replaces the user's signed
            # beta or touches its private saves with an unrelated CI key.
            echo 'SA_PACKAGE_SUFFIX=.preview' >> "$GITHUB_ENV"
          fi
      - name: Build ARM32 and ARM64 candidate
        env:
          ANDROID_ABIS: armeabi-v7a arm64-v8a x86_64
          JOBS: '4'
          SA_EMULATOR_PACKAGE: '1'
        run: bash android/build-apk.sh sa2 > apk-build.log 2>&1
      - name: Verify packaged payload and certificate
        run: |
          cp android/out/SonicAdvance2-android-release.apk android/out/SonicAdvance2-Android-v0.2.0-OCS4-rc1.apk
          python3 android/verify-sa2-apk.py android/out/SonicAdvance2-Android-v0.2.0-OCS4-rc1.apk --abis armeabi-v7a,arm64-v8a --output android/out/apk-validation.json --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --expected-package "com.ylports.sonicadvance2${SA_PACKAGE_SUFFIX:-}"
          python3 android/verify-sa2-apk.py android/out/SonicAdvance2-android-emulator.apk --abis x86_64 --output android/out/emulator-apk-validation.json --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --expected-package "com.ylports.sonicadvance2${SA_PACKAGE_SUFFIX:-}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/out/SonicAdvance2-Android-v0.2.0-OCS4-rc1.apk > android/out/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android/out/SonicAdvance2-Android-v0.2.0-OCS4-rc1.apk > android/out/zip-alignment.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/out/SonicAdvance2-Android-v0.2.0-OCS4-rc1.apk > android/out/package.txt
          if [[ -n "${SA_SIGNING_KEYSTORE:-}" ]]; then
            grep -q '15767e621886f4c420af89c6f9767d1857b5fe830782095177a0166400a14e76' android/out/signature.txt
          fi
          sha256sum android/out/SonicAdvance2-Android-v0.2.0-OCS4-rc1.apk > android/out/SHA256SUMS
          tar -czf android/out/native-symbols.tar.gz build/android/*/sa2/sa2.android.elf build/android/*/sa2/sa2.android.map
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SonicAdvance2-v0.2.0-OCS4-candidate
          path: |
            android/out/*rc1.apk
            android/out/*emulator.apk
            android/out/*.json
            android/out/*.txt
            android/out/SHA256SUMS
            android/out/native-symbols.tar.gz
            apk-build.log
          if-no-files-found: warn
      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa2-signing.jks"

  android-emulator:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: SonicAdvance2-v0.2.0-OCS4-candidate
          path: emulator-input
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 android/test-emulator.py emulator-input emulator-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sa2-v020-android36-emulator
          path: emulator-evidence

  publish-candidate:
    # No stable release is created by this workflow. Publication requires an
    # explicit opt-in and the exact commit must pass all three verification jobs.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_candidate) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-rc1]')) }}
    needs: [apk, regressions, android-emulator]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SonicAdvance2-v0.2.0-OCS4-candidate
          path: candidate-input
      - uses: actions/download-artifact@v4
        with:
          name: sa2-v020-android36-emulator
          path: emulator-report
      - name: Prepare verified candidate and evidence
        env:
          VALIDATION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          source=pathlib.Path('candidate-input')
          target=pathlib.Path('publish'); target.mkdir()
          for name in ['SonicAdvance2-Android-v0.2.0-OCS4-rc1.apk', 'apk-validation.json', 'signature.txt', 'zip-alignment.txt']:
              shutil.copy2(next(source.rglob(name)), target/name)
          report=next(pathlib.Path('emulator-report').rglob('report.json'))
          assert json.loads(report.read_text())['status']=='passed'
          shutil.copy2(report, target/'android36-emulator-report.json')
          apk=target/'SonicAdvance2-Android-v0.2.0-OCS4-rc1.apk'
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          validation=json.loads((target/'apk-validation.json').read_text())
          assert validation['sha256']==digest
          assert set(validation['abis'])=={'armeabi-v7a','arm64-v8a'}
          (target/'SHA256SUMS').write_text(digest+'  '+apk.name+'\n')
          notes=pathlib.Path('docs/RELEASE_v0.2.0-rc1.md').read_text()
          notes+='\nVerificación de este commit, registros y capturas: '+os.environ['VALIDATION_URL']+'\n'
          pathlib.Path('release-notes.md').write_text(notes)
          PY
      - name: Publish RC1 without overwriting an earlier release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.2.0-ocs4-rc1 >/dev/null 2>&1; then
            echo 'RC1 already exists; preserve the existing release and use a new candidate version.' >&2
            exit 1
          fi
          gh release create v0.2.0-ocs4-rc1 publish/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'Sonic Advance 2 Android v0.2.0 OCS4 — RC1 de prueba' --notes-file release-notes.md
